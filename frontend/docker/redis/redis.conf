# =============================================================================
# Configuration Redis pour le frontend
# =============================================================================

# Persistance des données (Append Only File)
appendonly yes

# Politique de mémoire maximale (optionnel)
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Authentification (décommenter pour activer)
# requirepass mysecretpassword

# Bind sur toutes les interfaces (nécessaire pour Docker)
bind 0.0.0.0

# Protection contre les connexions externes (désactivé car dans un réseau Docker)
protected-mode no

# Timeout des connexions inactives (0 = pas de timeout)
timeout 0

# Keepalive
tcp-keepalive 300
