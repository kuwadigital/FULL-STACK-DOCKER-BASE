# =============================================================================
# BACKEND DOCKER COMPOSE CONFIGURATION
# =============================================================================
# Services disponibles:
#   - php: Application PHP (FPM)
#   - nginx: Serveur web Nginx
#   - mysql/postgres/mongo: Bases de données (avec profiles)
#   - redis: Cache
#   - adminer: Interface d'administration BDD
#
# Utilise le .env global de la racine du projet via --env-file dans le Makefile
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PHP-FPM
  # ---------------------------------------------------------------------------
  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    container_name: abs_backend_php
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - APP_ENV=${APP_ENV:-development}
      # Keycloak
      - KEYCLOAK_URL=https://${AUTH_HOST:-auth.local}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-abs-app}
      - KEYCLOAK_CLIENT=${KEYCLOAK_BACKEND_CLIENT:-abs-backend}
      # Base de données
      - DB_HOST=mysql
      - DB_DATABASE=${MYSQL_DATABASE:-abs_db}
      - DB_USERNAME=${MYSQL_USER:-abs_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-abs_secret}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Email (via Greenmail)
      - MAIL_HOST=greenmail
      - MAIL_PORT=25
      - MAIL_FROM=noreply@${MAIL_HOST:-mail.local}
    volumes:
      - ../src:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-overrides.ini:ro
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
    networks:
      - abs_backend_network
      - abs_services_network
    depends_on:
      - redis

  # ---------------------------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      args:
        NGINX_VERSION: ${NGINX_BACKEND_VERSION:-1.27}
    container_name: abs_backend_nginx
    depends_on:
      - php
    volumes:
      - ../src:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${BACKEND_PORT:-8000}:80"
    networks:
      - abs_backend_network
      - abs_services_network
    labels:
      - "traefik.enable=true"
      # Routage HTTPS pour l'API
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_HOST:-api.local}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=80"
      # Middleware CORS
      - "traefik.http.routers.backend.middlewares=cors-headers@file"

  # ---------------------------------------------------------------------------
  # MySQL
  # ---------------------------------------------------------------------------
  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION:-8.0}
    container_name: abs_backend_mysql
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-abs_db}
      - MYSQL_USER=${MYSQL_USER:-abs_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-abs_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    container_name: abs_backend_postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-abs_db}
      - POSTGRES_USER=${POSTGRES_USER:-abs_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-abs_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    build:
      context: ./mongo
      args:
        MONGO_VERSION: ${MONGO_VERSION:-7}
    container_name: abs_backend_mongo
    profiles: ["mongo"]
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-abs_db}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    build:
      context: ./redis
      args:
        REDIS_VERSION: ${REDIS_BACKEND_VERSION:-7}
    container_name: abs_backend_redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BACKEND_PORT:-6379}:6379"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # MySQL Test
  # ---------------------------------------------------------------------------
  mysql_test:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION:-8.0}
    container_name: abs_backend_mysql_test
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-abs_db}_test
      - MYSQL_USER=${MYSQL_USER:-abs_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-abs_secret}
    volumes:
      - mysql_test_data:/var/lib/mysql
    ports:
      - "${MYSQL_TEST_PORT:-3307}:3306"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # PostgreSQL Test
  # ---------------------------------------------------------------------------
  postgres_test:
    build:
      context: ./postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    container_name: abs_backend_postgres_test
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-abs_db}_test
      - POSTGRES_USER=${POSTGRES_USER:-abs_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-abs_secret}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # MongoDB Test
  # ---------------------------------------------------------------------------
  mongo_test:
    build:
      context: ./mongo
      args:
        MONGO_VERSION: ${MONGO_VERSION:-7}
    container_name: abs_backend_mongo_test
    profiles: ["mongo"]
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-abs_db}_test
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret}
    volumes:
      - mongo_test_data:/data/db
    ports:
      - "${MONGO_TEST_PORT:-27018}:27017"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # Adminer - Interface BDD
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: abs_backend_adminer
    restart: "no"
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - abs_backend_network

  # ---------------------------------------------------------------------------
  # RabbitMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4.0}-management
    container_name: abs_backend_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - abs_backend_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    name: abs_backend_mysql_data
  postgres_data:
    name: abs_backend_postgres_data
  mongo_data:
    name: abs_backend_mongo_data
  redis_data:
    name: abs_backend_redis_data
  mysql_test_data:
    name: abs_backend_mysql_test_data
  postgres_test_data:
    name: abs_backend_postgres_test_data
  mongo_test_data:
    name: abs_backend_mongo_test_data

# =============================================================================
# Networks
# =============================================================================
networks:
  abs_backend_network:
    name: ${NETWORK_BACKEND:-abs_backend_network}
    external: true
  abs_services_network:
    name: ${NETWORK_SERVICES:-abs_services_network}
    external: true
