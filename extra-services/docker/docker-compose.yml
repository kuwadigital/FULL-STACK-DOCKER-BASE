# =============================================================================
# EXTRA SERVICES - DOCKER COMPOSE
# =============================================================================
# Services d'infrastructure pour le développement complet:
# - Traefik: Reverse proxy et point d'entrée central avec SSL
# - Keycloak: Gestion des identités et accès (IAM)
# - PostgreSQL: Base de données dédiée pour Keycloak
# - Greenmail: Serveur mail de test
# - Roundcube: Client webmail
# - Inbound Parse: Simulateur SendGrid Inbound Parse
# =============================================================================

services:
  # ===========================================================================
  # TRAEFIK - Reverse Proxy & Load Balancer
  # ===========================================================================
  traefik:
    image: traefik:${TRAEFIK_VERSION:-3.2}
    container_name: abs_traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.45
    command:
      # API et Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Logs
      - "--log.level=${TRAEFIK_LOG_LEVEL:-DEBUG}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${NETWORK_SERVICES:-abs_services_network}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirection HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # TLS - Certificats auto-signés pour le développement
      - "--entrypoints.websecure.http.tls=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/config:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./logs/traefik:/var/log/traefik
    networks:
      - services_network
      - frontend_network
      - backend_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST:-traefik.local}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls=true"

  # ===========================================================================
  # KEYCLOAK - Identity and Access Management
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    container_name: abs_keycloak
    restart: unless-stopped
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      # Admin
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST:-postgres-keycloak}:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
      # Proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${AUTH_HOST:-auth.local}
      # Logging
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - services_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${AUTH_HOST:-auth.local}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  # ===========================================================================
  # POSTGRESQL - Base de données dédiée pour Keycloak
  # ===========================================================================
  postgres-keycloak:
    image: postgres:${POSTGRES_KEYCLOAK_VERSION:-16}-alpine
    container_name: abs_postgres_keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - services_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # GREENMAIL - Serveur Mail de Test
  # ===========================================================================
  greenmail:
    image: greenmail/standalone:${GREENMAIL_VERSION:-2.0.1}
    container_name: abs_greenmail
    restart: unless-stopped
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=user1:password1@mail.local,user2:password2@mail.local,user3:password3@mail.local,user4:password4@mail.local,user5:password5@mail.local -Dgreenmail.verbose
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true -Xmx512m
    ports:
      - "${GREENMAIL_SMTP_PORT:-25}:3025"
      - "${GREENMAIL_SMTPS_PORT:-465}:3465"
      - "${GREENMAIL_IMAP_PORT:-143}:3143"
      - "${GREENMAIL_IMAPS_PORT:-993}:3993"
      - "${GREENMAIL_POP3_PORT:-110}:3110"
      - "${GREENMAIL_POP3S_PORT:-995}:3995"
      - "${GREENMAIL_API_PORT:-8082}:8080"
    networks:
      - services_network
    labels:
      - "traefik.enable=false"

  # ===========================================================================
  # ROUNDCUBE - Client Webmail
  # ===========================================================================
  roundcube:
    image: roundcube/roundcubemail:${ROUNDCUBE_VERSION:-1.6-apache}
    container_name: abs_roundcube
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ${ROUNDCUBE_DEFAULT_HOST:-greenmail}
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: ${ROUNDCUBE_SMTP_SERVER:-greenmail}
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 50M
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve
      ROUNDCUBEMAIL_SKIN: elastic
      # Strip domain from username for Greenmail authentication (user1 instead of user1@mail.local)
      ROUNDCUBEMAIL_LOGIN_LC: 2
    volumes:
      - roundcube_data:/var/www/html/db
      - roundcube_config:/var/roundcube/config
    depends_on:
      - greenmail
    networks:
      - services_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roundcube.rule=Host(`${MAIL_HOST:-mail.local}`)"
      - "traefik.http.routers.roundcube.entrypoints=websecure"
      - "traefik.http.routers.roundcube.tls=true"
      - "traefik.http.services.roundcube.loadbalancer.server.port=80"

  # ===========================================================================
  # INBOUND PARSE - Simulateur SendGrid Inbound Parse
  # ===========================================================================
  inbound-parse:
    build:
      context: ./inbound-parse
      dockerfile: Dockerfile
    container_name: abs_inbound_parse
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${INBOUND_PARSE_LOG_LEVEL:-debug}
      HTTP_PORT: 8080
      SMTP_PORT: 2525
      CONFIG_PATH: /app/config/config.json
    volumes:
      - ./inbound-parse/config:/app/config:ro
      - inbound_parse_data:/app/data
    ports:
      - "${INBOUND_PARSE_SMTP_PORT:-2525}:2525"
    networks:
      - services_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inbound-parse.rule=Host(`parse.local`) || HostRegexp(`{subdomain:[a-z]+}.parse.local`)"
      - "traefik.http.routers.inbound-parse.entrypoints=websecure"
      - "traefik.http.routers.inbound-parse.tls=true"
      - "traefik.http.services.inbound-parse.loadbalancer.server.port=8080"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_keycloak_data:
    name: abs_postgres_keycloak_data
  roundcube_data:
    name: abs_roundcube_data
  roundcube_config:
    name: abs_roundcube_config
  inbound_parse_data:
    name: abs_inbound_parse_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  services_network:
    name: ${NETWORK_SERVICES:-abs_services_network}
    driver: bridge
  frontend_network:
    name: ${NETWORK_FRONTEND:-abs_frontend_network}
    external: true
  backend_network:
    name: ${NETWORK_BACKEND:-abs_backend_network}
    external: true
